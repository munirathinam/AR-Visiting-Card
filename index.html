
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Munirathinam - AR Visiting Card</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #102d20;
      color: white;
    }

    .heading {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .heading h2 {
      margin: 0;
      font-size: 23px;
    }

    .heading p {
      font-size: 13px;
    }

    .instructions {
      position: fixed;
      bottom: 16px;
      left: 5%;
      width: 90%;
      text-align: center;
      z-index: 10;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="heading">
    <h2>Welcome to My AR Visiting Card</h2>
    <p>Munirathinam T | Assistant Professor</p>
  </div>

  <div class="instructions" id="message">
    Point your camera at the printed visiting card.
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="card-image" src="./visiting-card.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Content appears when the card is detected -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Card reference plane -->
      <a-plane
        src="#card-image"
        position="0 0 0"
        width="1"
        height="0.6">
      </a-plane>

      <!-- Floating animated sphere -->
      <a-sphere
        position="0 0.65 0.15"
        radius="0.12"
        color="#57E389"
        animation="
          property: position;
          to: 0 0.8 0.15;
          dir: alternate;
          dur: 1000;
          loop: true">
      </a-sphere>

      <!-- Digital profile -->
      <a-text
        value="WELCOME!"
        position="0 0.42 0.12"
        align="center"
        color="#FFFFFF"
        width="1.8">
      </a-text>

      <a-text
        value="Munirathinam T"
        position="0 0.28 0.12"
        align="center"
        color="#57E389"
        width="1.8">
      </a-text>

      <a-text
        value="Assistant Professor"
        position="0 0.16 0.12"
        align="center"
        color="#FFFFFF"
        width="1.4">
      </a-text>

      <a-text
        value="Computer Science and Engineering"
        position="0 0.05 0.12"
        align="center"
        color="#FFFFFF"
        width="1.2">
      </a-text>

    </a-entity>

  </a-scene>

  <script>
    const target = document.querySelector(
      '[mindar-image-target]'
    );

    const message = document.getElementById('message');

    target.addEventListener('targetFound', function () {
      message.textContent = 'AR Visiting Card Detected!';
    });

    target.addEventListener('targetLost', function () {
      message.textContent =
        'Point your camera at the printed visiting card.';
    });
  </script>

</body>
</html>
